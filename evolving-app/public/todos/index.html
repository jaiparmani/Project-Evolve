<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="global-error" role="alert" aria-live="assertive"></div>
  <header>
    <h1>Todo List</h1>
  </header>
  <main>
    <section aria-labelledby="add-todo-section">
      <h2 id="add-todo-section" class="visually-hidden">Add a new todo</h2>
      <form id="todo-form" aria-label="Add todo">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          aria-required="true"
          required
        />
        <button type="submit">Add</button>
      </form>
    </section>
    <section aria-labelledby="todo-list-section">
      <h2 id="todo-list-section" class="visually-hidden">Todo items</h2>
      <ul id="todo-list" role="list"></ul>
    </section>
  </main>
  <script>
    (function () {
      function showError(message) {
        try {
          var el = document.getElementById('global-error');
          if (!el) return;
          el.textContent = 'Something went wrong: ' + message;
          el.style.display = 'block';
        } catch (e) { /* never let the handler itself throw */ }
      }
      window.addEventListener('error', function (event) {
        var msg = event && event.message ? event.message : 'Unknown error';
        showError(msg);
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason || 'Unhandled promise rejection');
        showError(msg);
      });
    })();
  </script>
  <script src="app.js" type="module"></script>
</body>
</html>
