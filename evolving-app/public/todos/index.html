<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Todo List</h1>
  </header>
  <main>
    <section aria-labelledby="add-todo-section">
      <h2 id="add-todo-section" class="visually-hidden">Add a new todo</h2>
      <form id="todo-form" aria-label="Add todo">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          aria-required="true"
          required
        />
        <button type="submit">Add</button>
      </form>
    </section>
    <section aria-labelledby="todo-list-section">
      <h2 id="todo-list-section" class="visually-hidden">Todo items</h2>
      <ul id="todo-list" role="list"></ul>
    </section>
    <section id="empty-state" class="empty-state">
      <p>No todos yet. Add one above!</p>
    </section>
  </main>
  <footer>
    <a href="../../index.html">← Back to Home</a>
  </footer>
  <script src="app.js" type="module"></script>
</body>
</html>
