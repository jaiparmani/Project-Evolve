version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evolve
      POSTGRES_USER: evolve
      POSTGRES_PASSWORD: evolve_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolve"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  control-room:
    build:
      context: .
      dockerfile: docker/Dockerfile.control
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=sqlite://./data/evolve.db
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./evolving-app:/app/evolving-app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - DATABASE_URL=sqlite://./data/evolve.db
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./evolving-app:/app/evolving-app
      - ./.git:/app/.git
    depends_on:
      control-room:
        condition: service_started
    restart: unless-stopped

  evolving-app:
    build:
      context: ./evolving-app
      dockerfile: ../docker/Dockerfile.app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped

volumes:
  pgdata:
