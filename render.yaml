services:
  - type: web
    name: project-evolve
    runtime: node
    plan: free
    buildCommand: npm install && npx tsx src/db/migrate.ts
    startCommand: npx tsx src/web/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LLM_PROVIDER
        value: gateway
      - key: LLM_GATEWAY_URL
        value: https://llm-gateway.brain-store.workers.dev
      - key: LLM_GATEWAY_TOKEN
        sync: false
      - key: EVOLVE_APP_DIR
        value: ./evolving-app
      - key: DEPLOY_PORT
        value: 3001
      - key: EVOLVE_INTERVAL_MINUTES
        value: 30
      - key: EVOLVE_MAX_CYCLES_PER_DAY
        value: 0
      - key: EVOLVE_LOOP_DELAY_SECONDS
        value: 15
      - key: EVOLVE_CYCLE_TIMEOUT_MINUTES
        value: 20
      # Deploy between cycles instead of mid-cycle: turn off Auto-Deploy for this
      # service, create a Deploy Hook (Settings > Deploy Hook) and paste it here.
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
